<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4F6D45" />
    <meta name="description" content="GINYARAIDEE - เพื่อนสุขภาพใจดี ที่อยู่ข้างคุณทุกวัน" />

    <!-- PWA / iOS -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GINYARAIDEE" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>GINYARAIDEE — เพื่อนสุขภาพใจดี</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #F7F1E6; overscroll-behavior: none; }
      html[data-theme="dark"] body { background: #171C16; }
    </style>
    <script>
      // ตั้งธีมก่อนหน้าเว็บวาด — กันจอกะพริบขาวตอนเปิดแอปในโหมดมืด
      try {
        var t = JSON.parse(localStorage.getItem('gyn_theme') || '"auto"');
        if (t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
